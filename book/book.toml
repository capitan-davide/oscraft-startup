[book]
title = "The OsCraft Startup Library"
description = "How oscraft-startup, a QNX OS 8.0 startup library in Rust, prepares a board for the kernel."
authors = ["The OsCraft authors"]
language = "en"
src = "src"

[build]
# Next to the BSP book's; a stand-alone checkout of the crate builds it
# elsewhere with --dest-dir (see README.md).
build-dir = "../../build/book/startup"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
