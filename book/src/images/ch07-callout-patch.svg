<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
  <style>
    .k { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .y { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .u { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .w { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .ln { fill: none; stroke: #333333; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .t { text-anchor: middle; }
    .b { font-weight: bold; }
    .s { font-size: 10px; fill: #444444; }
    .m { font-family: DejaVu Sans Mono, monospace; font-size: 11px; }
  </style>
  <rect width="820" height="360" fill="#ffffff"/>
  <!-- startup text -->
  <text class="b" x="20" y="24">1. In startup's text</text>
  <rect class="k" x="20" y="34" width="230" height="130" rx="4"/>
  <text class="m" x="32" y="56">mov  x6, #0</text>
  <text class="m" x="32" y="72">movk x6, #0, lsl #16</text>
  <text class="m" x="32" y="88">movk x6, #0, lsl #32</text>
  <text class="m" x="32" y="104">movk x6, #0, lsl #48</text>
  <text class="m" x="32" y="124">ldr  w0, [x6, #0xc]</text>
  <text class="m" x="32" y="140">...</text>
  <text class="s" x="32" y="156">a callout: code between two symbols</text>
  <!-- section ref -->
  <text class="b" x="20" y="200">2. In a section, until output</text>
  <rect class="y" x="20" y="210" width="230" height="56" rx="4"/>
  <text class="m" x="32" y="232">intrinfo[0].id.rtn =</text>
  <text class="m" x="32" y="250">  0x0ca11007_00000000 | 0</text>
  <text class="s" x="32" y="290">a tagged reference to entry 0 of</text>
  <text class="s" x="32" y="304">the callout table, with its patch</text>
  <text class="s" x="32" y="318">value: the GICC's virtual address</text>
  <!-- system page copy -->
  <text class="b" x="320" y="24">3. Copied to the system page, patched</text>
  <rect class="k" x="320" y="34" width="250" height="130" rx="4"/>
  <text class="m" x="332" y="56">mov  x6, #0x6000</text>
  <text class="m" x="332" y="72">movk x6, #0x4020, lsl #16</text>
  <text class="m" x="332" y="88">movk x6, #0xff80, lsl #32</text>
  <text class="m" x="332" y="104">movk x6, #0xffff, lsl #48</text>
  <text class="m" x="332" y="124">ldr  w0, [x6, #0xc]</text>
  <text class="m" x="332" y="140">...</text>
  <text class="s" x="332" y="156">at kernel address ffffff8040207000</text>
  <path class="ln" d="M250,90 L318,90" marker-end="url(#a)"/>
  <text class="t s" x="284" y="82">copy</text>
  <!-- section resolved -->
  <rect class="y" x="320" y="210" width="250" height="56" rx="4"/>
  <text class="m" x="332" y="232">intrinfo[0].id.rtn =</text>
  <text class="m" x="332" y="250">  ffffff8040207000</text>
  <path class="ln" d="M250,240 L318,240" marker-end="url(#a)"/>
  <text class="t s" x="284" y="232">resolve</text>
  <path class="ln dash" d="M445,210 L445,166" marker-end="url(#a)"/>
  <!-- kernel -->
  <text class="b" x="630" y="24">4. The kernel calls it</text>
  <rect class="u" x="630" y="34" width="170" height="130" rx="4"/>
  <text class="t" x="715" y="80">procnto's interrupt</text>
  <text class="t" x="715" y="96">entry code</text>
  <text class="t s" x="715" y="120">copies id/eoi inline;</text>
  <text class="t s" x="715" y="134">calls the others</text>
  <path class="ln" d="M628,100 L572,100" marker-end="url(#a)"/>
  <path class="ln dash" d="M715,166 C715,240 640,240 572,240" marker-end="url(#a)"/>
  <text class="s" x="650" y="262">finds it through</text>
  <text class="s" x="650" y="276">the section</text>
</svg>
