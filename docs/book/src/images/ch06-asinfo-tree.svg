<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12">
  <style>
    .y { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .g { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .n { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .ln { fill: none; stroke: #666666; stroke-width: 1.2; }
    .t { text-anchor: middle; }
    .b { font-weight: bold; }
    .s { font-size: 10px; fill: #444444; }
  </style>
  <rect width="820" height="300" fill="#ffffff"/>
  <rect class="y" x="350" y="16" width="120" height="40" rx="5"/>
  <text class="t b" x="410" y="34">memory</text>
  <text class="t s" x="410" y="48">0 - 2^44-1</text>
  <rect class="y" x="80" y="90" width="120" height="40" rx="5"/>
  <text class="t b" x="140" y="108">below4G</text>
  <text class="t s" x="140" y="122">0 - 4G-1</text>
  <rect class="n" x="240" y="90" width="90" height="40" rx="5"/>
  <text class="t" x="285" y="114">gicd, gicc</text>
  <rect class="n" x="350" y="90" width="120" height="40" rx="5"/>
  <text class="t" x="410" y="108">imagefs</text>
  <text class="t s" x="410" y="122">startup, bootram</text>
  <rect class="n" x="490" y="90" width="80" height="40" rx="5"/>
  <text class="t" x="530" y="114">fdt</text>
  <rect class="y" x="80" y="160" width="120" height="40" rx="5"/>
  <text class="t b" x="140" y="178">ram</text>
  <text class="t s" x="140" y="192">0 - 2G-1</text>
  <rect class="n" x="20" y="230" width="100" height="40" rx="5"/>
  <text class="t" x="70" y="248">vcram</text>
  <text class="t s" x="70" y="262">GPU's</text>
  <rect class="y" x="140" y="230" width="110" height="40" rx="5"/>
  <text class="t b" x="195" y="248">below1G</text>
  <text class="t s" x="195" y="262">0 - 0x3bffffff</text>
  <rect class="g" x="280" y="230" width="230" height="40" rx="5"/>
  <text class="t b" x="395" y="248">sysram (3 pieces)</text>
  <text class="t s" x="395" y="262">the kernel's free RAM below 1 GB</text>
  <rect class="g" x="540" y="160" width="200" height="40" rx="5"/>
  <text class="t b" x="640" y="178">sysram</text>
  <text class="t s" x="640" y="192">0x40000000 - 0x7fffffff</text>
  <path class="ln" d="M410,56 L140,90"/>
  <path class="ln" d="M410,56 L285,90"/>
  <path class="ln" d="M410,56 L410,90"/>
  <path class="ln" d="M410,56 L530,90"/>
  <path class="ln" d="M140,130 L140,160"/>
  <path class="ln" d="M140,200 L70,230"/>
  <path class="ln" d="M140,200 L195,230"/>
  <path class="ln" d="M200,180 L540,180"/>
  <path class="ln" d="M250,250 L280,250"/>
  <text class="s" x="560" y="240">Each entry points to its parent</text>
  <text class="s" x="560" y="254">by offset; the array is the tree</text>
  <text class="s" x="560" y="268">in the order the entries were added.</text>
</svg>
