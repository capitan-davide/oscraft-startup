<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
  <style>
    .k { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .y { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .u { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .g { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .w { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .ln { fill: none; stroke: #333333; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .t { text-anchor: middle; }
    .b { font-weight: bold; }
    .s { font-size: 10px; fill: #444444; }
    .m { font-family: DejaVu Sans Mono, monospace; font-size: 11px; }
  </style>
  <rect width="820" height="400" fill="#ffffff"/>
  <!-- sources -->
  <text class="b" x="20" y="24">Interrupt sources</text>
  <rect class="g" x="20" y="40" width="170" height="90" rx="4"/>
  <text class="t b" x="105" y="62">Devices</text>
  <text class="t s" x="105" y="80">UART, SD card, PCIe, ...</text>
  <text class="t s" x="105" y="96">one line each,</text>
  <text class="t s" x="105" y="110">shared by all CPUs</text>
  <rect class="g" x="20" y="170" width="170" height="90" rx="4"/>
  <text class="t b" x="105" y="192">Each CPU's own</text>
  <text class="t s" x="105" y="210">timers, performance</text>
  <text class="t s" x="105" y="224">monitor, ...: one set</text>
  <text class="t s" x="105" y="238">per CPU</text>
  <path class="ln" d="M190,85 L258,85" marker-end="url(#a)"/>
  <text class="t s" x="224" y="78">SPIs</text>
  <text class="t s" x="224" y="100">32 and up</text>
  <path class="ln" d="M190,215 L258,215" marker-end="url(#a)"/>
  <text class="t s" x="224" y="208">PPIs</text>
  <text class="t s" x="224" y="230">16-31</text>
  <!-- distributor -->
  <text class="b" x="260" y="24">Distributor (GICD), one</text>
  <rect class="y" x="260" y="40" width="250" height="300" rx="4"/>
  <rect class="w" x="274" y="54" width="222" height="92" rx="3"/>
  <text class="b" x="286" y="74">Shared part: SPIs</text>
  <text class="s" x="286" y="92">enable (ISENABLER, ICENABLER)</text>
  <text class="s" x="286" y="106">priority (IPRIORITYR)</text>
  <text class="s" x="286" y="120">trigger mode (ICFGR)</text>
  <text class="s" x="286" y="134">target CPUs (ITARGETSR)</text>
  <rect class="w" x="274" y="160" width="222" height="104" rx="3"/>
  <text class="b" x="286" y="180">Banked part: SGIs, PPIs</text>
  <text class="s" x="286" y="198">IDs 0-31, the same registers, but</text>
  <text class="s" x="286" y="212">each CPU sees its own copy:</text>
  <text class="s" x="286" y="226">CPU 1's PPI 27 is not CPU 0's</text>
  <text class="s" x="286" y="248">a CPU sets up its own (Listing 8.4)</text>
  <rect class="w" x="274" y="278" width="222" height="48" rx="3"/>
  <text class="m" x="286" y="298">GICD_SGIR</text>
  <text class="s" x="286" y="314">raises an SGI (0-15) on chosen CPUs</text>
  <!-- CPU interfaces -->
  <text class="b" x="560" y="24">CPU interfaces</text>
  <rect class="k" x="560" y="50" width="110" height="80" rx="4"/>
  <text class="t b" x="615" y="72">GICC 0</text>
  <text class="t m" x="615" y="92">IAR  EOIR</text>
  <text class="t m" x="615" y="108">PMR</text>
  <rect class="k" x="560" y="170" width="110" height="80" rx="4"/>
  <text class="t b" x="615" y="192">GICC 1</text>
  <text class="t m" x="615" y="212">IAR  EOIR</text>
  <text class="t m" x="615" y="228">PMR</text>
  <text class="t s" x="615" y="272">one per CPU, all at the</text>
  <text class="t s" x="615" y="286">same address</text>
  <path class="ln" d="M510,90 L558,90" marker-end="url(#a)"/>
  <path class="ln" d="M510,210 L558,210" marker-end="url(#a)"/>
  <text class="t s" x="534" y="200">route</text>
  <!-- CPUs -->
  <text class="b" x="730" y="24">CPUs</text>
  <rect class="u" x="730" y="50" width="70" height="80" rx="4"/>
  <text class="t b" x="765" y="94">CPU 0</text>
  <rect class="u" x="730" y="170" width="70" height="80" rx="4"/>
  <text class="t b" x="765" y="214">CPU 1</text>
  <path class="ln" d="M670,74 L728,74" marker-end="url(#a)"/>
  <text class="t s" x="700" y="68">IRQ</text>
  <path class="ln" d="M728,108 L672,108" marker-end="url(#a)"/>
  <text class="t s" x="700" y="124">ack, end</text>
  <path class="ln" d="M670,194 L728,194" marker-end="url(#a)"/>
  <text class="t s" x="700" y="188">IRQ</text>
  <path class="ln" d="M728,228 L672,228" marker-end="url(#a)"/>
  <text class="t s" x="700" y="244">ack, end</text>
  <!-- SGI path -->
  <path class="ln dash" d="M765,250 L765,370 L385,370 L385,328" marker-end="url(#a)"/>
  <text class="s" x="520" y="364">a CPU sends an IPI: it writes GICD_SGIR (SGIs 0-15)</text>
</svg>
