<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker></defs>
  <style>
    .k { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .y { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .n { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .w { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .ln { fill: none; stroke: #333333; stroke-width: 1.2; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.2; }
    .dash { stroke-dasharray: 4 3; }
    .t { text-anchor: middle; }
    .b { font-weight: bold; }
    .s { font-size: 10px; fill: #444444; }
    .m { font-family: DejaVu Sans Mono, monospace; font-size: 10px; }
  </style>
  <rect width="820" height="470" fill="#ffffff"/>
  <!-- per-CPU L0 -->
  <text class="b" x="20" y="24">Per-CPU L0 (TTBR1)</text>
  <rect class="y" x="20" y="34" width="150" height="26"/>
  <text class="m" x="28" y="51">[0] message window</text>
  <rect class="y" x="20" y="60" width="150" height="26"/>
  <text class="m" x="28" y="77">[1] kernel</text>
  <text class="s" x="20" y="102">CPU 0 at L0_vaddr, CPU n</text>
  <text class="s" x="20" y="115">64 bytes further</text>
  <!-- shared L1 -->
  <text class="b" x="230" y="24">Shared L1 (1 GB per entry)</text>
  <rect class="k" x="230" y="34" width="190" height="26"/>
  <text class="m" x="238" y="51">[0] -&gt; L1 itself</text>
  <rect class="k" x="230" y="60" width="190" height="26"/>
  <text class="m" x="238" y="77">[1] -&gt; L2</text>
  <rect class="w" x="230" y="86" width="190" height="26"/>
  <text class="m" x="238" y="103">[2..511] free</text>
  <path class="lnk" d="M170,73 L228,47" marker-end="url(#ak)"/>
  <path class="lnk dash" d="M420,47 C460,20 460,70 422,50" marker-end="url(#ak)"/>
  <text class="s" x="452" y="32">recursive</text>
  <!-- L2 -->
  <text class="b" x="520" y="24">L2 under L1[1] (2 MB per entry)</text>
  <rect class="k" x="520" y="34" width="270" height="26"/>
  <text class="m" x="528" y="51">[0] -&gt; L1 (L2 tables appear here)</text>
  <rect class="y" x="520" y="60" width="270" height="26"/>
  <text class="m" x="528" y="77">[1..255] startup's mappings</text>
  <rect class="u" x="520" y="86" width="270" height="26"/>
  <text class="m" x="528" y="103">[256..511] bootstrap programs</text>
  <path class="lnk" d="M420,73 L518,47" marker-end="url(#ak)"/>
  <!-- the address map -->
  <text class="b" x="20" y="160">The kernel's 512 GB (L0[1]), from KERN_BASE = ffffff80.00000000</text>
  <rect class="k" x="20" y="172" width="180" height="70"/>
  <text class="t b" x="110" y="196">L3_BASE</text>
  <text class="t m" x="110" y="214">ffffff80.00000000</text>
  <text class="t s" x="110" y="230">1 GB: every L3 table</text>
  <rect class="k" x="200" y="172" width="120" height="70"/>
  <text class="t b" x="260" y="196">L2_BASE</text>
  <text class="t m" x="260" y="214">ffffff80.40000000</text>
  <text class="t s" x="260" y="230">2 MB: the L2</text>
  <rect class="y" x="320" y="172" width="170" height="70"/>
  <text class="t b" x="405" y="196">STARTUP_BASE</text>
  <text class="t m" x="405" y="214">ffffff80.40200000</text>
  <text class="t s" x="405" y="230">system page, L0s, devices</text>
  <rect class="u" x="490" y="172" width="170" height="70"/>
  <text class="t b" x="575" y="196">BOOTPGM_BASE</text>
  <text class="t m" x="575" y="214">ffffff80.60000000</text>
  <text class="t s" x="575" y="230">procnto, linked by mkifs</text>
  <rect class="w" x="660" y="172" width="140" height="70"/>
  <text class="t" x="730" y="200">unused</text>
  <text class="t m" x="730" y="218">ffffff80.80000000</text>
  <!-- whole VA space -->
  <text class="b" x="20" y="290">The whole virtual address space</text>
  <rect class="n" x="20" y="300" width="230" height="56"/>
  <text class="t b" x="135" y="322">TTBR0: 512 GB</text>
  <text class="t m" x="135" y="340">00000000.00 - 0000007f.ff..</text>
  <rect class="w" x="250" y="300" width="180" height="56"/>
  <text class="t" x="340" y="332">not mapped</text>
  <rect class="y" x="430" y="300" width="180" height="56"/>
  <text class="t b" x="520" y="322">L0[0]: 512 GB</text>
  <text class="t m" x="520" y="340">message transfers</text>
  <rect class="k" x="610" y="300" width="190" height="56"/>
  <text class="t b" x="705" y="322">L0[1]: 512 GB</text>
  <text class="t m" x="705" y="340">the kernel's</text>
  <text class="s" x="20" y="380">During startup, TTBR0 holds a 1:1 map of startup's own pages, so that the instruction after</text>
  <text class="s" x="20" y="394">turning the MMU on still runs. The kernel replaces it with each process's tables (ASID 0 stays startup's).</text>
  <text class="s" x="20" y="418">T0SZ = 25 (39 bits) for TTBR0, T1SZ = 24 (40 bits) for TTBR1: bit 39 of a kernel address selects L0[0] or L0[1].</text>
</svg>
