<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
  <style>
    .y { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .g { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .n { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .ln { fill: none; stroke: #333333; stroke-width: 1.3; }
    .t { text-anchor: middle; }
    .b { font-weight: bold; }
    .s { font-size: 10px; fill: #444444; }
    .m { font-family: DejaVu Sans Mono, monospace; font-size: 11px; }
  </style>
  <rect width="820" height="400" fill="#ffffff"/>
  <!-- image -->
  <text class="b" x="20" y="24">The image in RAM</text>
  <text class="s" x="20" y="38">each row is a page</text>
  <text class="m" x="20" y="74">0x13c000</text>
  <rect class="y" x="110" y="52" width="170" height="36"/>
  <text class="t" x="195" y="74">data</text>
  <text class="m" x="20" y="110">0x13d000</text>
  <rect class="y" x="110" y="88" width="85" height="36"/>
  <text class="t s" x="152" y="110">data, 0x800</text>
  <rect class="n" x="195" y="88" width="85" height="36"/>
  <text class="t s" x="237" y="110">next file</text>
  <text class="m" x="20" y="146">0x13e000</text>
  <rect class="n" x="110" y="124" width="170" height="36"/>
  <text class="t s" x="195" y="146">next file</text>
  <text class="s" x="110" y="178">this page is shared: a kernel that wrote its .bss</text>
  <text class="s" x="110" y="192">here would corrupt the next file</text>
  <!-- new RAM -->
  <text class="b" x="110" y="232">New RAM, from the allocator</text>
  <rect class="y" x="110" y="244" width="85" height="36"/>
  <text class="t s" x="152" y="266">data, 0x800</text>
  <rect class="g" x="195" y="244" width="85" height="36"/>
  <text class="t s" x="237" y="266">zero</text>
  <rect class="g" x="110" y="280" width="170" height="36"/>
  <text class="t s" x="195" y="302">zero</text>
  <rect class="g" x="110" y="316" width="170" height="36"/>
  <text class="t s" x="195" y="338">zero</text>
  <rect class="g" x="110" y="352" width="170" height="36"/>
  <text class="t s" x="195" y="374">zero</text>
  <!-- virtual -->
  <text class="b" x="560" y="24">The kernel's address space</text>
  <text class="s" x="560" y="38">one segment: FileSiz 0x1800, MemSiz 0x4800</text>
  <rect class="y" x="560" y="52" width="240" height="36"/>
  <text class="t" x="680" y="74">data, at 0x..600c0000</text>
  <text class="m" x="560" y="156">0x..600c1000</text>
  <rect class="y" x="560" y="164" width="120" height="36"/>
  <text class="t s" x="620" y="186">data, 0x800</text>
  <rect class="g" x="680" y="164" width="120" height="36"/>
  <text class="t s" x="740" y="186">.bss</text>
  <rect class="g" x="560" y="200" width="240" height="36"/>
  <text class="t s" x="680" y="222">.bss</text>
  <rect class="g" x="560" y="236" width="240" height="36"/>
  <text class="t s" x="680" y="258">.bss</text>
  <rect class="g" x="560" y="272" width="240" height="36"/>
  <text class="t s" x="680" y="294">.bss to 0x..600c4800, then zero</text>
  <!-- map -->
  <path class="ln" d="M280,70 L558,70" marker-end="url(#a)"/>
  <text class="t b m" x="410" y="62">Step::Map</text>
  <text class="t s" x="410" y="84">size 0x1000: the whole page stays in place</text>
  <!-- copy -->
  <path class="ln" d="M110,106 L92,106 L92,262 L108,262" marker-end="url(#a)"/>
  <text class="s" x="20" y="182">copied</text>
  <text class="s" x="20" y="196">0x800 bytes</text>
  <!-- alloc -->
  <text class="t b m" x="410" y="244">Step::Alloc</text>
  <text class="t s" x="410" y="260">size 0x4000: zeroed RAM, with 0x800 bytes</text>
  <text class="t s" x="410" y="274">copied from 0x13d000 to its start</text>
  <path class="ln" d="M280,316 L530,316 L530,218 L558,218" marker-end="url(#a)"/>
  <text class="t s" x="410" y="308">mapped</text>
</svg>
