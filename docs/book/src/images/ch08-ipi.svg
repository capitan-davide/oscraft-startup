<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
  <style>
    .k { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .y { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .u { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .g { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 4 3; }
    .ln { fill: none; stroke: #333333; stroke-width: 1.3; }
    .t { text-anchor: middle; }
    .b { font-weight: bold; }
    .s { font-size: 11px; fill: #333333; }
    .m { font-family: DejaVu Sans Mono, monospace; font-size: 11px; }
  </style>
  <rect width="820" height="380" fill="#ffffff"/>
  <!-- heads -->
  <rect class="u" x="40" y="16" width="160" height="34" rx="5"/>
  <text class="t b" x="120" y="38">CPU 0 (sender)</text>
  <rect class="g" x="250" y="16" width="160" height="34" rx="5"/>
  <text class="t b m" x="330" y="38">ipicmds[1]</text>
  <rect class="y" x="440" y="16" width="160" height="34" rx="5"/>
  <text class="t b" x="520" y="38">GIC</text>
  <rect class="u" x="630" y="16" width="160" height="34" rx="5"/>
  <text class="t b" x="710" y="38">CPU 1 (target)</text>
  <path class="life" d="M120,50 L120,365"/>
  <path class="life" d="M330,50 L330,365"/>
  <path class="life" d="M520,50 L520,365"/>
  <path class="life" d="M710,50 L710,365"/>
  <!-- 1 -->
  <path class="ln" d="M120,84 L328,84" marker-end="url(#a)"/>
  <text class="s" x="128" y="76">1. send_ipi: set the command bits</text>
  <text class="s" x="128" y="100">(ldxr / stxr: atomic)</text>
  <!-- 2 -->
  <path class="ln" d="M120,134 L518,134" marker-end="url(#a)"/>
  <text class="s" x="128" y="126">2. only if the word was empty: write <tspan class="m">GICD_SGIR</tspan>,</text>
  <text class="s" x="128" y="150">SGI 0, target list bit 16 + CPU 1's interface (gic_map)</text>
  <!-- 3 -->
  <path class="ln" d="M520,180 L708,180" marker-end="url(#a)"/>
  <text class="s" x="528" y="172">3. IRQ</text>
  <!-- 4 -->
  <path class="ln" d="M710,214 L522,214" marker-end="url(#a)"/>
  <text class="s" x="530" y="206">4. id: read <tspan class="m">GICC_IAR</tspan></text>
  <text class="s" x="530" y="230">SGI 0, from CPU 0 (bits 10-12)</text>
  <!-- 5 -->
  <path class="ln" d="M710,262 L522,262" marker-end="url(#a)"/>
  <text class="s" x="530" y="254">5. id: write <tspan class="m">GICC_EOIR</tspan> at once</text>
  <text class="s" x="530" y="278">SGI 0 can be raised again</text>
  <!-- 6 -->
  <path class="ln" d="M710,316 L332,316" marker-end="url(#a)"/>
  <text class="s" x="340" y="308">6. the kernel takes the commands, clears the word, acts on them</text>
  <!-- note -->
  <rect class="g" x="20" y="200" width="240" height="56" rx="4"/>
  <text class="s" x="30" y="220">another send_ipi before step 6 finds</text>
  <text class="s" x="30" y="236">the word not empty: it only adds its</text>
  <text class="s" x="30" y="252">bits, no second SGI is needed</text>
</svg>
