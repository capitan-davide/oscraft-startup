<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
  <style>
    .k { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .y { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .u { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .g { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .ln { fill: none; stroke: #333333; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .t { text-anchor: middle; }
    .b { font-weight: bold; }
    .s { font-size: 10px; fill: #444444; }
    .m { font-family: DejaVu Sans Mono, monospace; font-size: 11px; }
  </style>
  <rect width="820" height="360" fill="#ffffff"/>
  <text class="b" x="20" y="24">Kernel vectors</text>
  <text class="b" x="230" y="24">intrinfo entries</text>
  <text class="b" x="600" y="24">Controller IDs</text>
  <!-- entry 0 -->
  <rect class="k" x="20" y="40" width="170" height="34" rx="3"/>
  <text class="t m" x="105" y="61">0 - 31</text>
  <rect class="k" x="20" y="80" width="170" height="34" rx="3"/>
  <text class="t m" x="105" y="101">0x8000 - 0x801f</text>
  <text class="t s" x="105" y="134">... CPU n: n * 0x8000 + id</text>
  <rect class="k" x="230" y="40" width="330" height="100" rx="4"/>
  <text class="b" x="242" y="60">Entry 0: the GIC's SGIs and PPIs</text>
  <text class="m" x="242" y="80">vector_base 0, num_vectors 32</text>
  <text class="m" x="242" y="96">local_stride 0x8000</text>
  <text class="s" x="242" y="116">per CPU: each CPU's copy gets its own vectors;</text>
  <text class="s" x="242" y="130">CPU 0's timer is vector 27, CPU 1's 0x801b</text>
  <rect class="k" x="600" y="40" width="200" height="34" rx="3"/>
  <text class="t s" x="700" y="61">GIC IDs 0-31 of CPU 0</text>
  <rect class="k" x="600" y="80" width="200" height="34" rx="3"/>
  <text class="t s" x="700" y="101">GIC IDs 0-31 of CPU 1</text>
  <path class="ln" d="M190,57 L228,57" marker-end="url(#a)"/>
  <path class="ln" d="M190,97 L228,97" marker-end="url(#a)"/>
  <path class="ln" d="M560,57 L598,57" marker-end="url(#a)"/>
  <path class="ln" d="M560,97 L598,97" marker-end="url(#a)"/>
  <!-- entry 1 -->
  <rect class="y" x="20" y="170" width="170" height="34" rx="3"/>
  <text class="t m" x="105" y="191">32 - 32 + N - 1</text>
  <rect class="y" x="230" y="160" width="330" height="70" rx="4"/>
  <text class="b" x="242" y="180">Entry 1: the GIC's SPIs</text>
  <text class="m" x="242" y="200">vector_base 32, num_vectors N</text>
  <text class="s" x="242" y="220">shared: one vector each; callouts see GIC ID - 32</text>
  <rect class="y" x="600" y="170" width="200" height="34" rx="3"/>
  <text class="t s" x="700" y="191">GIC IDs 32 - 32 + N - 1</text>
  <path class="ln" d="M190,187 L228,187" marker-end="url(#a)"/>
  <path class="ln" d="M560,187 L598,187" marker-end="url(#a)"/>
  <!-- entry 2 -->
  <rect class="g" x="20" y="270" width="170" height="34" rx="3"/>
  <text class="t m" x="105" y="291">0x1000 - ...</text>
  <rect class="g" x="230" y="256" width="330" height="70" rx="4"/>
  <text class="b" x="242" y="276">Entry 2: a cascaded controller (MSI)</text>
  <text class="m" x="242" y="296">vector_base 0x1000, cascade_vector S</text>
  <text class="s" x="242" y="316">asked only when vector S, one of the SPIs, is taken</text>
  <rect class="g" x="600" y="270" width="200" height="34" rx="3"/>
  <text class="t s" x="700" y="291">the MSI controller's own IDs</text>
  <path class="ln" d="M190,287 L228,287" marker-end="url(#a)"/>
  <path class="ln" d="M560,287 L598,287" marker-end="url(#a)"/>
  <path class="ln dash" d="M700,304 C700,330 790,330 790,250 L790,212" marker-end="url(#a)"/>
  <text class="s" x="610" y="346">its output is wired to SPI S of the GIC</text>
  <text class="s" x="20" y="346">The vector numbers of entry 2 are an example.</text>
</svg>
