<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker></defs>
  <style>
    .k { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .y { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .u { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .g { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .n { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .w { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .ln { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.4; }
    .t { text-anchor: middle; }
    .b { font-weight: bold; }
    .s { font-size: 10px; fill: #444444; }
    .m { font-family: DejaVu Sans Mono, monospace; font-size: 11px; }
  </style>
  <rect width="820" height="400" fill="#ffffff"/>
  <text class="b" x="20" y="22">Virtual address <tspan class="m">0xffff_ff80_4021_3018</tspan></text>
  <!-- the address, split -->
  <rect class="n" x="20" y="34" width="100" height="50"/>
  <text class="t s" x="70" y="50">bits 63-40</text>
  <text class="t m" x="70" y="72">all ones</text>
  <rect class="y" x="120" y="34" width="130" height="50"/>
  <text class="t s" x="185" y="50">bit 39: L0 index</text>
  <text class="t m" x="185" y="72">1</text>
  <rect class="y" x="250" y="34" width="140" height="50"/>
  <text class="t s" x="320" y="50">bits 38-30: L1 index</text>
  <text class="t m" x="320" y="72">1</text>
  <rect class="y" x="390" y="34" width="140" height="50"/>
  <text class="t s" x="460" y="50">bits 29-21: L2 index</text>
  <text class="t m" x="460" y="72">1</text>
  <rect class="y" x="530" y="34" width="140" height="50"/>
  <text class="t s" x="600" y="50">bits 20-12: L3 index</text>
  <text class="t m" x="600" y="72">19</text>
  <rect class="g" x="670" y="34" width="130" height="50"/>
  <text class="t s" x="735" y="50">bits 11-0: offset</text>
  <text class="t m" x="735" y="72">0x018</text>
  <!-- index arrows -->
  <path class="ln" d="M70,84 L70,160" marker-end="url(#a)"/>
  <text class="s" x="76" y="124">selects</text>
  <text class="s" x="76" y="136">TTBR1</text>
  <path class="ln" d="M185,84 L185,120" marker-end="url(#a)"/>
  <path class="ln" d="M320,84 L320,120" marker-end="url(#a)"/>
  <path class="ln" d="M460,84 L460,120" marker-end="url(#a)"/>
  <path class="ln" d="M600,84 L600,120" marker-end="url(#a)"/>
  <path class="ln" d="M735,84 L735,120" marker-end="url(#a)"/>
  <!-- TTBR1 -->
  <rect class="n" x="20" y="162" width="100" height="48" rx="4"/>
  <text class="t b m" x="70" y="182">TTBR1_EL1</text>
  <text class="t s" x="70" y="198">physical address</text>
  <!-- L0 -->
  <text class="b" x="193" y="108">L0</text>
  <rect class="w" x="140" y="122" width="90" height="28"/>
  <text class="t m" x="185" y="141">[0]</text>
  <rect class="k" x="140" y="150" width="90" height="28"/>
  <text class="t m" x="185" y="169">[1]</text>
  <text class="t s" x="185" y="192">two entries</text>
  <!-- L1 -->
  <text class="b" x="328" y="108">L1</text>
  <rect class="w" x="275" y="122" width="90" height="28"/>
  <text class="t m" x="320" y="141">[0]</text>
  <rect class="k" x="275" y="150" width="90" height="28"/>
  <text class="t m" x="320" y="169">[1]</text>
  <rect class="w" x="275" y="178" width="90" height="28"/>
  <text class="t m" x="320" y="197">...</text>
  <rect class="w" x="275" y="206" width="90" height="28"/>
  <text class="t m" x="320" y="225">[511]</text>
  <!-- L2 -->
  <text class="b" x="468" y="108">L2</text>
  <rect class="w" x="415" y="122" width="90" height="28"/>
  <text class="t m" x="460" y="141">[0]</text>
  <rect class="k" x="415" y="150" width="90" height="28"/>
  <text class="t m" x="460" y="169">[1]</text>
  <rect class="w" x="415" y="178" width="90" height="28"/>
  <text class="t m" x="460" y="197">...</text>
  <rect class="w" x="415" y="206" width="90" height="28"/>
  <text class="t m" x="460" y="225">[511]</text>
  <!-- L3 -->
  <text class="b" x="608" y="108">L3</text>
  <rect class="w" x="555" y="122" width="90" height="28"/>
  <text class="t m" x="600" y="141">[0]</text>
  <rect class="w" x="555" y="150" width="90" height="28"/>
  <text class="t m" x="600" y="169">...</text>
  <rect class="k" x="555" y="178" width="90" height="28"/>
  <text class="t m" x="600" y="197">[19]</text>
  <rect class="w" x="555" y="206" width="90" height="28"/>
  <text class="t m" x="600" y="225">[511]</text>
  <!-- page -->
  <text class="b" x="743" y="108">4 KB page</text>
  <rect class="u" x="680" y="122" width="110" height="28"/>
  <text class="t m" x="735" y="141">0xfe201000</text>
  <rect class="g" x="680" y="150" width="110" height="28"/>
  <text class="t m" x="735" y="169">+ 0x018</text>
  <rect class="u" x="680" y="178" width="110" height="56"/>
  <text class="t s" x="735" y="202">the UART's</text>
  <text class="t s" x="735" y="216">registers</text>
  <!-- next table arrows -->
  <path class="lnk" d="M120,174 L138,164" marker-end="url(#ak)"/>
  <path class="lnk" d="M230,164 L250,164 L250,136 L273,136" marker-end="url(#ak)"/>
  <path class="lnk" d="M365,164 L390,164 L390,136 L413,136" marker-end="url(#ak)"/>
  <path class="lnk" d="M505,164 L530,164 L530,136 L553,136" marker-end="url(#ak)"/>
  <path class="lnk" d="M645,192 L662,192 L662,136 L678,136" marker-end="url(#ak)"/>
  <!-- explanation -->
  <text class="s" x="20" y="268">Each table is one page of RAM: 512 entries of 8 bytes. The blue arrows are physical addresses, held in the entries.</text>
  <text class="s" x="20" y="284">Each arrow leads to the start of the next table; the address's index for that level then picks the entry in it.</text>
  <rect class="n" x="20" y="304" width="780" height="72" rx="4"/>
  <text class="b" x="34" y="326">Result</text>
  <text class="m" x="34" y="346">entry L3[19] gives the page 0xfe201000, the offset is copied: physical address 0xfe201018</text>
  <text class="s" x="34" y="364">The walk read four table entries. The TLB keeps the result, so that the next access to this page needs none.</text>
</svg>
