<svg xmlns="http://www.w3.org/2000/svg" width="920" height="450" viewBox="0 0 920 450" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
  <style>
    .k { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .y { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .ln { fill: none; stroke: #333333; stroke-width: 1.3; }
    .br { fill: none; stroke: #666666; stroke-width: 1; }
    .t { text-anchor: middle; }
    .r { text-anchor: end; }
    .b { font-weight: bold; }
    .s { font-size: 11px; fill: #444444; }
    .m { font-family: DejaVu Sans Mono, monospace; font-size: 11px; }
  </style>
  <rect width="920" height="450" fill="#ffffff"/>
  <g transform="translate(60,0)">
  <text class="b" x="240" y="24">The image in RAM (QEMU raspi4b example)</text>
  <!-- column of the image -->
  <rect class="n" x="240" y="40" width="250" height="40"/>
  <text class="t" x="365" y="64">boot prefix (raw.boot)</text>
  <rect class="y" x="240" y="80" width="250" height="40"/>
  <text class="t" x="365" y="104">startup header</text>
  <rect class="k" x="240" y="120" width="250" height="90"/>
  <text class="t b" x="365" y="150">startup</text>
  <text class="t s" x="365" y="168">.text (_start first), .rodata,</text>
  <text class="t s" x="365" y="182">.data (boot_args), .bss</text>
  <rect class="y" x="240" y="210" width="250" height="40"/>
  <text class="t" x="365" y="234">image header ("imagefs")</text>
  <rect class="y" x="240" y="250" width="250" height="40"/>
  <text class="t" x="365" y="274">directory entries</text>
  <rect class="u" x="240" y="290" width="250" height="60"/>
  <text class="t b" x="365" y="316">procnto-smp-instr</text>
  <text class="t s" x="365" y="334">bootstrap executable, linked in place</text>
  <rect class="u" x="240" y="350" width="250" height="60"/>
  <text class="t" x="365" y="376">other files: ksh, libc.so,</text>
  <text class="t" x="365" y="392">drivers, the boot script</text>
  <rect class="n" x="240" y="410" width="250" height="24"/>
  <text class="t s" x="365" y="427">trailer (checksum)</text>
  <!-- addresses -->
  <text class="r m" x="232" y="44">0x80000</text>
  <text class="r m" x="232" y="84">0x80fa0</text>
  <text class="r m" x="232" y="124">0x810a0</text>
  <text class="r m" x="232" y="214">IFS</text>
  <!-- left brackets: startup_size, stored_size -->
  <path class="br" d="M120,80 L110,80 L110,210 L120,210"/>
  <text class="r s" x="104" y="140">startup_size</text>
  <text class="r s" x="104" y="154">(never compressed)</text>
  <path class="br" d="M150,80 L140,80 L140,434 L150,434"/>
  <text class="r s" x="134" y="300">stored_size</text>
  <!-- right annotations -->
  <path class="ln" d="M600,64 L494,64" marker-end="url(#a)"/>
  <text x="606" y="60">the boot loader enters here:</text>
  <text x="606" y="74">a jump to startup's entry</text>
  <path class="ln" d="M600,104 L494,104" marker-end="url(#a)"/>
  <text x="606" y="100">where the image is, how big</text>
  <text x="606" y="114">its parts are, how it is stored</text>
  <path class="ln" d="M600,165 L494,165" marker-end="url(#a)"/>
  <text x="606" y="161">linked here by mkifs from a</text>
  <text x="606" y="175">relocatable object</text>
  <path class="ln" d="M600,270 L494,270" marker-end="url(#a)"/>
  <text x="606" y="266">startup walks these to find</text>
  <text x="606" y="280">the bootstrap executables</text>
  <path class="ln" d="M600,320 L494,320" marker-end="url(#a)"/>
  <text x="606" y="316">mapped where it is; only its</text>
  <text x="606" y="330">.bss gets new RAM</text>
  <path class="ln" d="M600,380 L494,380" marker-end="url(#a)"/>
  <text x="606" y="376">served by the kernel as</text>
  <text x="606" y="390">/proc/boot and the image's paths</text>
  </g>
</svg>
