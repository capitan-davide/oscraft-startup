<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
  <style>
    .k { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .y { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .u { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .ln { fill: none; stroke: #333333; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .t { text-anchor: middle; }
    .b { font-weight: bold; }
    .s { font-size: 10px; fill: #444444; }
    .m { font-family: DejaVu Sans Mono, monospace; font-size: 11px; }
    .r { fill: #b03a2e; font-weight: bold; }
    .x24 { fill: none; stroke: #b03a2e; stroke-width: 1.5; stroke-dasharray: 4 3; }
  </style>
  <rect width="820" height="470" fill="#ffffff"/>
  <!-- legend -->
  <rect class="u" x="560" y="14" width="14" height="12"/>
  <text class="s" x="580" y="24">kernel</text>
  <rect class="k" x="630" y="14" width="14" height="12"/>
  <text class="s" x="650" y="24">copied-in callout</text>
  <!-- IRQ -->
  <rect class="u" x="20" y="40" width="300" height="34" rx="4"/>
  <text class="t b" x="170" y="62">IRQ exception: the kernel's entry code</text>
  <path class="ln" d="M170,74 L170,96" marker-end="url(#a)"/>
  <!-- entry 0 id -->
  <rect class="k" x="20" y="98" width="300" height="74" rx="4"/>
  <text class="b" x="32" y="118">Entry 0's id (SGIs, PPIs)</text>
  <text class="m" x="32" y="136">read GICC_IAR → <tspan class="r">x24</tspan>  (acknowledge)</text>
  <text class="m" x="32" y="152">x19 = ID if ID &lt; 32, else -1</text>
  <text class="s" x="32" y="166">SGI 0, the IPI: write GICC_EOIR now</text>
  <path class="ln" d="M170,172 L170,194" marker-end="url(#a)"/>
  <text class="s" x="178" y="188">x19 = -1: try the next entry</text>
  <!-- entry 1 id -->
  <rect class="k" x="20" y="196" width="300" height="60" rx="4"/>
  <text class="b" x="32" y="216">Entry 1's id (SPIs)</text>
  <text class="m" x="32" y="234">reads nothing: uses <tspan class="r">x24</tspan></text>
  <text class="m" x="32" y="250">x19 = ID - 32, or -1 if 1022, 1023</text>
  <path class="ln" d="M170,256 L170,280" marker-end="url(#a)"/>
  <text class="s" x="178" y="274">x19 = -1: no entry has it</text>
  <rect class="n" x="20" y="282" width="300" height="30" rx="4"/>
  <text class="t" x="170" y="302">spurious: return from the exception</text>
  <!-- found -->
  <path class="ln" d="M320,152 L350,152 L350,170 L440,170 L440,186" marker-end="url(#a)"/>
  <text class="s" x="358" y="184">x19 ≠ -1</text>
  <path class="ln" d="M320,226 L440,226 L440,190"/>
  <text class="s" x="330" y="220">x19 ≠ -1</text>
  <rect class="u" x="380" y="188" width="420" height="50" rx="4"/>
  <text class="m" x="392" y="208">vector = vector_base + cpu * local_stride + x19</text>
  <text class="s" x="392" y="228">of the entry whose id found it</text>
  <path class="ln" d="M590,238 L590,262" marker-end="url(#a)"/>
  <rect class="u" x="380" y="264" width="420" height="50" rx="4"/>
  <text class="b" x="392" y="284">Run what is attached to the vector</text>
  <text class="s" x="392" y="302">a kernel handler (the clock), or: mask it and wake the driver's thread</text>
  <path class="ln" d="M590,314 L590,338" marker-end="url(#a)"/>
  <rect class="k" x="380" y="340" width="420" height="60" rx="4"/>
  <text class="b" x="392" y="360">The same entry's eoi</text>
  <text class="m" x="392" y="378">write <tspan class="r">x24</tspan> to GICC_EOIR  (end)</text>
  <text class="s" x="392" y="394">skipped for SGI 0: already ended in id</text>
  <path class="ln" d="M590,400 L590,424" marker-end="url(#a)"/>
  <rect class="u" x="380" y="426" width="420" height="30" rx="4"/>
  <text class="t" x="590" y="446">return from the exception</text>
  <!-- x24 note -->
  <rect class="n" x="380" y="96" width="420" height="44" rx="4"/>
  <text class="s" x="392" y="114"><tspan class="r">x24</tspan>: the one GICC_IAR value. The first id reads it once;</text>
  <text class="s" x="392" y="130">the second id and the eoi use the same value.</text>
</svg>
