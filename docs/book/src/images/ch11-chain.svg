<svg xmlns="http://www.w3.org/2000/svg" width="820" height="370" viewBox="0 0 820 370" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/></marker></defs>
  <style>
    .k { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .y { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .u { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .g { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .n { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .ln { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #b03a2e; stroke-width: 1.6; }
    .t { text-anchor: middle; }
    .b { font-weight: bold; }
    .s { font-size: 10px; fill: #444444; }
    .m { font-family: DejaVu Sans Mono, monospace; font-size: 11px; }
    .r { fill: #b03a2e; font-weight: bold; }
  </style>
  <rect width="820" height="370" fill="#ffffff"/>
  <!-- startup -->
  <rect class="u" x="20" y="60" width="130" height="70" rx="4"/>
  <text class="t b" x="85" y="90">Startup</text>
  <text class="t s" x="85" y="110">jumps to the first</text>
  <text class="t s" x="85" y="122">executable's entry</text>
  <path class="ln" d="M150,120 L232,120" marker-end="url(#a)"/>
  <!-- exe 1 -->
  <text class="b" x="220" y="24">First bootstrap executable</text>
  <rect class="n" x="220" y="40" width="240" height="280" rx="4"/>
  <rect class="g" x="234" y="52" width="212" height="52"/>
  <text class="m" x="244" y="70">ifs_bootstrap_head</text>
  <text class="m" x="244" y="84">signature  "BSHD"</text>
  <text class="m" x="244" y="98">bootstrap</text>
  <rect class="k" x="234" y="104" width="212" height="84"/>
  <text class="b" x="244" y="124">entry point</text>
  <text class="s" x="244" y="142">code: runs, then jumps to</text>
  <text class="s" x="244" y="156">its own next_entry</text>
  <rect class="y" x="234" y="212" width="212" height="90"/>
  <text class="m" x="244" y="230">ifs_bootstrap_data</text>
  <text class="m" x="244" y="248">size</text>
  <text class="m r" x="244" y="264">next_entry</text>
  <text class="m" x="244" y="280">args  (command line)</text>
  <text class="m" x="244" y="296">spare</text>
  <path class="ln" d="M446,94 L456,94 L456,226 L448,226" marker-end="url(#a)"/>
  <!-- exe 2 -->
  <text class="b" x="540" y="24">procnto, the last one</text>
  <rect class="n" x="540" y="40" width="240" height="280" rx="4"/>
  <rect class="g" x="554" y="52" width="212" height="52"/>
  <text class="m" x="564" y="70">ifs_bootstrap_head</text>
  <text class="m" x="564" y="84">signature  "BSHD"</text>
  <text class="m" x="564" y="98">bootstrap</text>
  <rect class="k" x="554" y="104" width="212" height="84"/>
  <text class="b" x="564" y="124">entry point</text>
  <text class="s" x="564" y="142">the kernel</text>
  <rect class="y" x="554" y="212" width="212" height="90"/>
  <text class="m" x="564" y="230">ifs_bootstrap_data</text>
  <text class="m" x="564" y="248">size</text>
  <text class="m r" x="564" y="264">next_entry = 0</text>
  <text class="m" x="564" y="280">args  (command line)</text>
  <text class="m" x="564" y="296">spare</text>
  <path class="ln" d="M766,94 L776,94 L776,226 L768,226" marker-end="url(#a)"/>
  <!-- link -->
  <path class="lnr" d="M318,264 L500,264 L500,120 L552,120" marker-end="url(#ar)"/>
  <text class="s r" x="334" y="340">next_entry: written by startup, once it has loaded the following executable.</text>
  <text class="s" x="20" y="356">Startup finds each head just before the entry point, follows its bootstrap pointer to the data, and fills in the previous executable's next_entry.</text>
</svg>
